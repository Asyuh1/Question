let actx = null, buffer = null, ready = null, node = null, timers = [], running = false, startedAt = 0;

$('yes').onclick = () => { document.title = 'ok'; show('ok'); };
$('no').onclick = startScare;

// Siapkan & decode audio saat halaman dibuka supaya langsung bunyi begitu tombol "no" ditekan.
function prepAudio() {
  const AC = window.AudioContext || window.webkitAudioContext;
  if (!AC) return;
  actx = new AC();
  const bin = atob(AUDIO_B64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  ready = actx.decodeAudioData(bytes.buffer).then(b => { buffer = b; }).catch(() => {});
}

function startSound() {
  if (!actx) return;
  actx.resume();
  (ready || Promise.resolve()).then(() => {
    if (!buffer || !running) return;
    const src = actx.createBufferSource(); src.buffer = buffer; src.loop = true;

    // Dorong sedikit + saturasi halus: lebih padat/keras tanpa menghancurkan suara aslinya.
    // (Level file aslinya sudah mendekati 0 dB, jadi tidak perlu dikali besar.)
    const drive = actx.createGain(); drive.gain.value = 1.4;
    const sat = actx.createWaveShaper();
    const curve = new Float32Array(2048);
    for (let i = 0; i < curve.length; i++) curve[i] = Math.tanh((i / 1024 - 1) * 2) / Math.tanh(2);
    sat.curve = curve; sat.oversample = '4x';

    src.connect(drive); drive.connect(sat); sat.connect(actx.destination);
    src.start(); node = src;
  });
}

function stopSound() {
  if (node) { try { node.stop(); } catch (e) {} node = null; }
}

function startScare() {
  if (running) return;
  running = true; startedAt = performance.now();
  show('scare');

  const el = document.documentElement;
  try { (el.requestFullscreen || el.webkitRequestFullscreen).call(el); } catch (e) {}
  startSound();

  const box = $('scare'), img = $('face');
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let on = false;
  timers.push(setInterval(() => {
    on = !on;
    box.style.background = on ? '#fff' : '#000';
    box.classList.toggle('inv', on);
    img.style.opacity = Math.random() < 0.2 ? 0 : 1;
    if (!reduced) {
      const s = 1.12 + Math.random() * 0.33;
      img.style.transform = `translate(${(Math.random() - .5) * 6}%, ${(Math.random() - .5) * 6}%) ` +
                            `scale(${s}) rotate(${(Math.random() - .5) * 6}deg)`;
    }
  }, reduced ? 400 : 60));
}

function stopScare() {
  if (!running) return;
  running = false;
  timers.forEach(clearInterval); timers = [];
  stopSound();
  if (document.fullscreenElement || document.webkitFullscreenElement)
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  show('q');
}

prepAudio();

// keluar dari fullscreen (Esc) = berhenti
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev =>
  document.addEventListener(ev, () => {
    if (!document.fullscreenElement && !document.webkitFullscreenElement) stopScare();
  }));
// cadangan kalau fullscreen tidak didukung (mis. iPhone): tap setelah 3 detik
$('scare').addEventListener('click', () => { if (performance.now() - startedAt > 3000) stopScare(); });
</script>
